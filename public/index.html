<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>绿茵预言家 · 清华MEM足球俱乐部</title>
<style>
:root{--primary:#1a472a;--primary-light:#2d6a4f;--accent:#f0b429;--accent-dark:#d69e2e;--bg:#0d1b12;--card:#14261c;--card-hover:#1a3326;--text:#e8f5e9;--text-muted:#81c784;--border:#2d6a4f;--gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;--danger:#ef5350;--success:#4caf50;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.header{background:linear-gradient(135deg,var(--primary) 0%,#0d2818 100%);padding:20px 16px 16px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.header h1{font-size:20px;font-weight:700;background:linear-gradient(90deg,var(--accent),#ffe082);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .subtitle{font-size:12px;color:var(--text-muted)}
.user-btn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px}
.user-btn .avatar{width:22px;height:22px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--primary);font-weight:bold}
.nav{display:flex;gap:3px;background:var(--card);border-radius:10px;padding:3px}
.nav-item{flex:1;text-align:center;padding:7px 2px;border-radius:8px;cursor:pointer;font-size:11px;transition:all .2s;color:var(--text-muted);font-weight:500}
.nav-item.active{background:var(--primary-light);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.nav-item .nav-icon{font-size:15px;display:block;margin-bottom:1px}
.content{padding:12px 16px 80px}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:all .2s}
.match-card{position:relative;overflow:hidden}
.match-card .stage-tag{position:absolute;top:12px;right:12px;background:var(--primary);color:var(--accent);font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.match-card .match-time{font-size:12px;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:4px}
.match-card .teams{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.team{flex:1;text-align:center}
.team .flag{font-size:32px;margin-bottom:2px}
.team .name{font-size:13px;font-weight:600}
.team .score{font-size:26px;font-weight:800;color:var(--accent);margin-top:2px}
.vs{font-size:14px;color:var(--text-muted);font-weight:700;padding:0 6px}
.prediction-row{display:flex;gap:6px;align-items:center;justify-content:center}
.prediction-row .team-label{font-size:12px;font-weight:600;width:50px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-input{width:52px;height:38px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:18px;font-weight:700;outline:none;transition:border-color .2s}
.score-input:focus{border-color:var(--accent)}
.submit-btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:var(--primary);transition:all .2s;margin-top:8px}
.submit-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(240,180,41,.3)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.prediction-status{text-align:center;padding:8px;border-radius:6px;font-size:13px;font-weight:600;margin-top:8px}
.prediction-status.pending{background:rgba(240,180,41,.15);color:var(--accent)}
.prediction-status.correct{background:rgba(76,175,80,.15);color:var(--success)}
.prediction-status.wrong{background:rgba(239,83,80,.1);color:var(--danger)}
.result-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.result-badge.bronze{background:rgba(205,127,50,.2);color:var(--bronze)}
.result-badge.gold{background:rgba(255,215,0,.15);color:var(--gold)}
.result-badge.crown{background:rgba(240,180,41,.2);color:var(--accent)}
.leaderboard-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid rgba(45,106,79,.3)}
.leaderboard-item:last-child{border-bottom:none}
.rank{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-right:12px;background:var(--card);border:1px solid var(--border)}
.rank.r1{background:linear-gradient(135deg,#ffd700,#ffb300);color:#333;border:none}
.rank.r2{background:linear-gradient(135deg,#c0c0c0,#9e9e9e);color:#333;border:none}
.rank.r3{background:linear-gradient(135deg,#cd7f32,#a0522d);color:#fff;border:none}
.lb-info{flex:1}.lb-name{font-size:15px;font-weight:600}.lb-stats{font-size:12px;color:var(--text-muted)}
.lb-points{font-size:20px;font-weight:800;color:var(--accent);min-width:60px;text-align:right}
.lb-points span{font-size:12px;font-weight:400;color:var(--text-muted)}
.stage-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.stage-tab{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--text-muted);transition:all .2s;font-weight:500;flex-shrink:0}
.stage-tab.active{background:var(--primary-light);color:var(--text);border-color:var(--primary-light)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state .title{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--text)}
.empty-state .desc{font-size:13px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:360px;transform:translateY(20px);transition:transform .3s}
.modal-overlay.show .modal{transform:translateY(0)}
.modal h2{font-size:18px;margin-bottom:16px;text-align:center}
.modal input,.modal select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px;outline:none;margin-bottom:12px}
.modal input:focus,.modal select:focus{border-color:var(--accent)}
.modal .btn-row{display:flex;gap:8px;margin-top:8px}
.modal .btn{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.modal .btn-primary{background:var(--accent);color:var(--primary)}
.modal .btn-secondary{background:var(--card-hover);color:var(--text);border:1px solid var(--border)}
.my-points{background:linear-gradient(135deg,var(--primary) 0%,#0d2818 100%);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px}
.my-points .total{font-size:48px;font-weight:800;color:var(--accent);line-height:1}
.my-points .label{font-size:13px;color:var(--text-muted);margin-top:4px}
.my-points .breakdown{display:flex;justify-content:center;gap:20px;margin-top:12px}
.my-points .breakdown .item{text-align:center}
.my-points .breakdown .val{font-size:18px;font-weight:700}
.my-points .breakdown .lbl{font-size:11px;color:var(--text-muted)}
.admin-match{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}
.admin-match .match-label{font-size:13px;font-weight:600;margin-bottom:8px}
.admin-match .score-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.admin-match .score-row input{width:50px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:18px;font-weight:700;padding:8px;outline:none}
.admin-match .score-row span{font-size:14px;color:var(--text-muted)}
.save-result-btn{padding:8px 16px;border:none;border-radius:6px;background:var(--success);color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:var(--accent);padding:12px 24px;border-radius:24px;font-size:14px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:300;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.date-header{font-size:14px;font-weight:700;color:var(--accent);padding:12px 0 6px;border-bottom:1px solid rgba(45,106,79,.3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.date-header .live-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
.loading{text-align:center;padding:40px;color:var(--text-muted)}
.loading .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.schedule-match{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid rgba(45,106,79,.2);font-size:13px}
.schedule-match:last-child{border-bottom:none}
.schedule-match .sch-time{width:46px;font-weight:600;color:var(--accent);font-size:13px;flex-shrink:0}
.schedule-match .sch-teams{flex:1;display:flex;align-items:center;gap:4px}
.schedule-match .sch-flag{font-size:20px}
.schedule-match .sch-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60px}
.schedule-match .sch-vs{font-size:11px;color:var(--text-muted);margin:0 2px}
.schedule-match .sch-score{font-size:16px;font-weight:800;color:var(--accent);min-width:40px;text-align:center}
.schedule-match .sch-group{font-size:11px;color:var(--text-muted);background:var(--bg);padding:2px 6px;border-radius:8px;flex-shrink:0}
.schedule-match.finished{opacity:.7}
.schedule-match.live{border-left:3px solid var(--danger);padding-left:8px}
@media(min-width:480px){.content{max-width:440px;margin:0 auto}}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>⚽ 绿茵预言家</h1>
      <div class="subtitle">清华MEM足球俱乐部 · 世界杯互动</div>
    </div>
    <div class="user-btn" onclick="showUserModal()">
      <div class="avatar" id="userAvatar">?</div>
      <span id="userName">登录</span>
    </div>
  </div>
  <div class="nav">
    <div class="nav-item active" data-view="predict" onclick="switchView('predict')">
      <span class="nav-icon">🔮</span>预言
    </div>
    <div class="nav-item" data-view="schedule" onclick="switchView('schedule')">
      <span class="nav-icon">📅</span>赛程
    </div>
    <div class="nav-item" data-view="leaderboard" onclick="switchView('leaderboard')">
      <span class="nav-icon">🏆</span>排行
    </div>
    <div class="nav-item" data-view="admin" onclick="switchView('admin')">
      <span class="nav-icon">⚙️</span>管理
    </div>
  </div>
</div>

<div class="content">
  <div class="view active" id="view-predict"><div class="loading"><div class="spinner"></div>加载中...</div></div>
  <div class="view" id="view-schedule"><div class="loading"><div class="spinner"></div>加载中...</div></div>
  <div class="view" id="view-leaderboard"><div class="loading"><div class="spinner"></div>加载中...</div></div>
  <div class="view" id="view-admin"><div class="loading"><div class="spinner"></div>加载中...</div></div>
</div>

<!-- User Modal -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <h2>👤 输入昵称</h2>
    <input type="text" id="inputNickname" placeholder="你的昵称" maxlength="10">
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeUserModal()">取消</button>
      <button class="btn btn-primary" onclick="loginUser()">进入</button>
    </div>
  </div>
</div>

<!-- Admin Login Modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <h2>🔒 管理员登录</h2>
    <input type="password" id="inputAdminPwd" placeholder="管理员密码">
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeAdminModal()">取消</button>
      <button class="btn btn-primary" onclick="adminLogin()">登录</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== CONFIG ==========
const API = '';
const AUTO_REFRESH_MS = 30000; // 30秒自动刷新

// ========== STATE ==========
let currentUser = null;
let matchesCache = [];
let predictionsCache = [];
let refreshTimer = null;

function getToken() { return localStorage.getItem('wc_token'); }
function setToken(t) { localStorage.setItem('wc_token', t); }
function clearToken() { localStorage.removeItem('wc_token'); currentUser = null; }

// ========== API ==========
async function api(path, opts = {}) {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

// ========== AUTH ==========
async function loginUser() {
  const name = document.getElementById('inputNickname').value.trim();
  if (!name) return;
  try {
    const data = await api('/api/register', { method: 'POST', body: JSON.stringify({ name }) });
    setToken(data.token);
    currentUser = data.user;
    closeUserModal();
    updateUserUI();
    renderAll();
    showToast('欢迎，' + data.user.name + '！');
  } catch(e) { showToast('❌ ' + e.message); }
}

async function adminLogin() {
  const pwd = document.getElementById('inputAdminPwd').value;
  if (!pwd) return;
  try {
    const data = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: pwd }) });
    setToken(data.token);
    currentUser = { id: 0, name: '管理员', isAdmin: true };
    closeAdminModal();
    updateUserUI();
    renderAll();
    showToast('✅ 管理员已登录');
  } catch(e) { showToast('❌ ' + e.message); }
}

async function checkAuth() {
  const token = getToken();
  if (!token) return;
  try {
    const data = await api('/api/me');
    currentUser = data;
  } catch(e) { clearToken(); }
}

function showUserModal() {
  document.getElementById('inputNickname').value = currentUser ? currentUser.name : '';
  document.getElementById('userModal').classList.add('show');
}
function closeUserModal() { document.getElementById('userModal').classList.remove('show'); }
function showAdminModal() { document.getElementById('adminModal').classList.add('show'); }
function closeAdminModal() { document.getElementById('adminModal').classList.remove('show'); }

function updateUserUI() {
  document.getElementById('userName').textContent = currentUser ? currentUser.name : '登录';
  document.getElementById('userAvatar').textContent = currentUser ? currentUser.name[0] : '?';
}

// ========== DATA ==========
async function loadMatches() {
  try { matchesCache = await api('/api/matches'); } catch(e) { matchesCache = []; }
}
async function loadPredictions() {
  if (!currentUser) { predictionsCache = []; return; }
  try { predictionsCache = await api('/api/predictions'); } catch(e) { predictionsCache = []; }
}

// ========== AUTO REFRESH ==========
function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(async () => {
    await loadMatches();
    await loadPredictions();
    // Re-render current view
    const activeNav = document.querySelector('.nav-item.active');
    if (activeNav) renderView(activeNav.dataset.view);
  }, AUTO_REFRESH_MS);
}

// ========== VIEWS ==========
function switchView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === viewId));
  renderView(viewId);
}

async function renderAll() {
  await loadMatches();
  await loadPredictions();
  updateUserUI();
  ['schedule','predict','leaderboard','admin'].forEach(v => renderView(v));
  startAutoRefresh();
}

async function renderView(viewId) {
  const el = document.getElementById('view-' + viewId);
  if (!el) return;
  switch(viewId) {
    case 'schedule': renderSchedule(el); break;
    case 'predict': await renderPredict(el); break;
    case 'leaderboard': await renderLeaderboard(el); break;
    case 'admin': renderAdmin(el); break;
  }
}

// ========== FLAGS ==========
const FLAGS = {'墨西哥':'🇲🇽','南非':'🇿🇦','韩国':'🇰🇷','捷克':'🇨🇿','巴西':'🇧🇷','德国':'🇩🇪','法国':'🇫🇷','阿根廷':'🇦🇷','西班牙':'🇪🇸','英格兰':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','葡萄牙':'🇵🇹','荷兰':'🇳🇱','意大利':'🇮🇹','比利时':'🇧🇪','克罗地亚':'🇭🇷','乌拉圭':'🇺🇾','哥伦比亚':'🇨🇴','日本':'🇯🇵','美国':'🇺🇸','加拿大':'🇨🇦','澳大利亚':'🇦🇺','瑞士':'🇨🇭','丹麦':'🇩🇰','塞尔维亚':'🇷🇸','波兰':'🇵🇱','瑞典':'🇸🇪','摩洛哥':'🇲🇦','加纳':'🇬🇭','厄瓜多尔':'🇪🇨','喀麦隆':'🇨🇲','突尼斯':'🇹🇳','沙特':'🇸🇦','伊朗':'🇮🇷','尼日利亚':'🇳🇬','埃及':'🇪🇬','塞内加尔':'🇸🇳','智利':'🇨🇱','秘鲁':'🇵🇪','中国':'🇨🇳','卡塔尔':'🇶🇦','乌克兰':'🇺🇦','奥地利':'🇦🇹','匈牙利':'🇭🇺','土耳其':'🇹🇷','波黑':'🇧🇦','巴拉圭':'🇵🇾','海地':'🇭🇹','苏格兰':'🏴󠁧󠁢󠁳󠁣󠁴󠁿','库拉索':'🇨🇼','科特迪瓦':'🇨🇮','新西兰':'🇳🇿','佛得角':'🇨🇻','阿尔及利亚':'🇩🇿','约旦':'🇯🇴','民主刚果':'🇨🇩','乌兹别克斯坦':'🇺🇿','巴拿马':'🇵🇦','伊拉克':'🇮🇶','挪威':'🇳🇴','阿尔及利亚':'🇩🇿','墨西哥城':'🏟️','瓜达拉哈拉':'🏟️','洛杉矶':'🏟️','纽约':'🏟️','达拉斯':'🏟️','休斯顿':'🏟️','迈阿密':'🏟️','旧金山':'🏟️','温哥华':'🏟️','多伦多':'🏟️','蒙特雷':'🏟️','波士顿':'🏟️','费城':'🏟️','亚特兰大':'🏟️','西雅图':'🏟️','堪萨斯城':'🏟️'};
function getFlag(n){return FLAGS[n]||'🏳️'}

const STAGES = [
  {id:'group1',name:'小组赛第1轮',short:'小组R1'},
  {id:'group2',name:'小组赛第2轮',short:'小组R2'},
  {id:'group3',name:'小组赛第3轮',short:'小组R3'},
  {id:'r32',name:'1/16决赛',short:'16强'},
  {id:'r16',name:'1/4决赛',short:'8强'},
  {id:'r8',name:'半决赛',short:'4强'},
  {id:'r3rd',name:'季军赛',short:'季军'},
  {id:'final',name:'决赛',short:'决赛'},
];
function getStageName(id){return STAGES.find(s=>s.id===id)?.short||id}
function getStageFullName(id){return STAGES.find(s=>s.id===id)?.name||id}

// ========== SCHEDULE VIEW ==========
function renderSchedule(el) {
  const now = new Date();
  const todayStr = now.toISOString().substring(0,10);
  
  // Group matches by date
  const grouped = {};
  matchesCache.forEach(m => {
    const d = m.match_date.substring(0,10);
    if (!grouped[d]) grouped[d] = [];
    grouped[d].push(m);
  });
  
  const dates = Object.keys(grouped).sort();
  let html = '';
  
  dates.forEach(d => {
    const isToday = d === todayStr;
    const isPast = d < todayStr;
    const dateObj = new Date(d + 'T00:00:00');
    const weekDay = ['日','一','二','三','四','五','六'][dateObj.getDay()];
    const label = isToday ? '🔥 今天' : `${parseInt(d.substring(5,7))}月${parseInt(d.substring(8,10))}日 周${weekDay}`;
    
    html += `<div class="date-header${isToday?' fade-in':''}">${label}${isToday?'<div class="live-dot"></div>':''}</div>`;
    html += `<div class="card" style="padding:8px 12px;margin-bottom:8px">`;
    
    grouped[d].forEach(m => {
      const time = m.match_date.substring(11,16);
      const hasResult = m.result_home != null;
      const isLive = !hasResult && new Date(m.match_date) <= now && new Date(new Date(m.match_date).getTime() + 120*60000) >= now;
      const cls = hasResult ? 'finished' : isLive ? 'live' : '';
      
      html += `<div class="schedule-match ${cls}">
        <div class="sch-time">${time}</div>
        <div class="sch-teams">
          <span class="sch-flag">${getFlag(m.home)}</span>
          <span class="sch-name">${m.home}</span>
          ${hasResult ? `<span class="sch-score">${m.result_home}:${m.result_away}</span>` : isLive ? `<span class="sch-score" style="color:var(--danger)">进行中</span>` : `<span class="sch-vs">vs</span>`}
          <span class="sch-name">${m.away}</span>
          <span class="sch-flag">${getFlag(m.away)}</span>
        </div>
        ${m.group_name ? `<span class="sch-group">${m.group_name}组</span>` : `<span class="sch-group">${getStageName(m.stage)}</span>`}
      </div>`;
    });
    
    html += `</div>`;
  });
  
  if (!dates.length) {
    html = `<div class="empty-state"><div class="icon">📅</div><div class="title">暂无赛程</div></div>`;
  }
  
  el.innerHTML = html;
}

// ========== PREDICT VIEW ==========
async function renderPredict(el) {
  if (!currentUser) {
    el.innerHTML = `<div class="empty-state"><div class="icon">⚽</div><div class="title">先登录再预言</div><div class="desc">点击右上角输入昵称后即可参与</div></div>`;
    return;
  }
  
  const myPreds = {};
  predictionsCache.forEach(p => { myPreds[p.match_id] = { home: p.pred_home, away: p.pred_away }; });
  const now = new Date();
  const allOpenM = [], closedM = [];
  
  matchesCache.forEach(m => {
    if (m.home === 'TBD' || m.home.startsWith('1') || m.home.startsWith('2') || m.home.startsWith('3')) return; // Skip TBD matches
    const mt = new Date(m.match_date);
    const dl = new Date(mt.getTime() - 30*60000);
    if (m.result_home != null || now >= dl) closedM.push(m);
    else allOpenM.push(m);
  });
  
  // ===== DETERMINE CURRENT ROUND =====
  // Find the stage of the earliest open match = current round
  let currentRoundStage = null;
  let currentRoundName = '';
  if (allOpenM.length > 0) {
    // Sort by match date to find the earliest
    allOpenM.sort((a, b) => a.match_date.localeCompare(b.match_date));
    currentRoundStage = allOpenM[0].stage;
    currentRoundName = getStageFullName(currentRoundStage);
  }
  
  // Only show matches from the current round
  const openM = currentRoundStage ? allOpenM.filter(m => m.stage === currentRoundStage) : [];
  // Count remaining rounds after current
  const remainingStages = [...new Set(allOpenM.filter(m => m.stage !== currentRoundStage).map(m => m.stage))];
  const remainingRoundCount = remainingStages.length;
  
  let html = '';
  
  // My stats
  let totalPts = 0, predCount = predictionsCache.length, correctCount = 0;
  matchesCache.forEach(m => {
    if (m.result_home != null && myPreds[m.id]) {
      const pts = calcPoints(myPreds[m.id], {home:m.result_home,away:m.result_away});
      totalPts += pts;
      if (pts > 0) correctCount++;
    }
  });
  
  html += `<div class="my-points fade-in">
    <div class="label">我的积分</div>
    <div class="total">${totalPts}</div>
    <div class="breakdown">
      <div class="item"><div class="val">${predCount}</div><div class="lbl">已预言</div></div>
      <div class="item"><div class="val">${correctCount}</div><div class="lbl">猜中</div></div>
      <div class="item"><div class="val">${allOpenM.length}</div><div class="lbl">待预言</div></div>
    </div>
  </div>`;
  
  // ===== UNIFIED PREDICTION FORM (CURRENT ROUND ONLY) =====
  if (openM.length) {
    html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font-size:14px;font-weight:600;color:var(--accent)">🔮 ${currentRoundName}</span>
      <span style="font-size:12px;color:var(--text-muted)">${openM.length}场可预言${remainingRoundCount > 0 ? ` · 还有${remainingRoundCount}轮` : ''}</span>
    </div>`;
    html += `<div class="card" style="padding:12px">`;
    
    let currentDate = '';
    openM.forEach((m, idx) => {
      const mDate = m.match_date.substring(0,10);
      if (mDate !== currentDate) {
        currentDate = mDate;
        const dateObj = new Date(mDate + 'T00:00:00');
        const weekDay = ['日','一','二','三','四','五','六'][dateObj.getDay()];
        const label = `${parseInt(mDate.substring(5,7))}月${parseInt(mDate.substring(8,10))}日 周${weekDay}`;
        if (idx > 0) html += `<div style="border-top:1px solid var(--border);margin:12px 0"></div>`;
        html += `<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">📅 ${label}</div>`;
      }
      
      const pred = myPreds[m.id];
      const time = m.match_date.substring(11,16);
      html += `<div style="margin-bottom:${idx < openM.length-1 ? '14px' : '0'}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:12px;color:var(--text-muted)">${time} · ${m.group_name?m.group_name+'组':''}</span>
          <span style="font-size:11px;background:var(--primary);color:var(--accent);padding:2px 8px;border-radius:8px">${getStageName(m.stage)}</span>
        </div>
        <div class="prediction-row" style="gap:8px">
          <span style="font-size:28px">${getFlag(m.home)}</span>
          <span style="font-size:14px;font-weight:800;width:54px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${m.home}</span>
          <input type="number" class="score-input" id="pred_${m.id}_h" min="0" max="20" value="${pred?pred.home:''}" placeholder="-" inputmode="numeric">
          <span style="font-size:18px;color:var(--accent);font-weight:900">:</span>
          <input type="number" class="score-input" id="pred_${m.id}_a" min="0" max="20" value="${pred?pred.away:''}" placeholder="-" inputmode="numeric">
          <span style="font-size:14px;font-weight:800;width:54px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${m.away}</span>
          <span style="font-size:28px">${getFlag(m.away)}</span>
        </div>
      </div>`;
    });
    
    html += `<button class="submit-btn" onclick="submitAllPredictions()" style="margin-top:12px">🔮 一键提交 ${currentRoundName}预言</button>`;
    html += `</div>`;
  } else if (allOpenM.length === 0) {
    // No open matches at all
  }
  
  // ===== NEXT ROUND PREVIEW =====
  if (remainingRoundCount > 0 && openM.length > 0) {
    const nextStage = remainingStages[0];
    const nextCount = allOpenM.filter(m => m.stage === nextStage).length;
    const nextDate = allOpenM.filter(m => m.stage === nextStage)[0]?.match_date;
    const nextDateStr = nextDate ? fmtDate(nextDate) : '';
    html += `<div class="card" style="opacity:.6;text-align:center;padding:12px;margin-top:8px">
      <div style="font-size:12px;color:var(--text-muted)">⏭ 下一轮</div>
      <div style="font-size:14px;font-weight:600;margin-top:4px">${getStageFullName(nextStage)}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${nextCount}场 · ${nextDateStr}开始</div>
    </div>`;
  }
  
  // ===== CLOSED MATCHES (current round first, then previous rounds) =====
  if (closedM.length) {
    // Group closed matches by stage, show current round's closed first
    const currentRoundClosed = closedM.filter(m => m.stage === currentRoundStage);
    const otherClosed = closedM.filter(m => m.stage !== currentRoundStage);
    const sortedClosed = [...currentRoundClosed, ...otherClosed];
    
    html += `<div style="font-size:14px;font-weight:600;margin:16px 0 8px;color:var(--text-muted)">📋 已结束 / 截止</div>`;
    sortedClosed.forEach(m => {
      const pred = myPreds[m.id];
      let statusHtml = '';
      if (m.result_home != null && pred) {
        const pts = calcPoints(pred, {home:m.result_home,away:m.result_away});
        const bd = getBreakdown(pred, {home:m.result_home,away:m.result_away});
        if (pts > 0) {
          const badges = bd.map(b=>`<span class="result-badge ${b.type}">${b.label} +${b.pts}</span>`).join(' ');
          statusHtml = `<div class="prediction-status correct">${badges} 总计 +${pts}</div>`;
        } else {
          statusHtml = `<div class="prediction-status wrong">❌ 未猜中</div>`;
        }
      } else if (m.result_home != null && !pred) {
        statusHtml = `<div class="prediction-status wrong">未参与</div>`;
      } else {
        statusHtml = `<div class="prediction-status pending">⏰ 预言已截止</div>`;
      }
      
      html += `<div class="card match-card fade-in" style="opacity:.8">
        <div class="stage-tag">${getStageName(m.stage)}</div>
        <div class="match-time">📅 ${fmtDate(m.match_date)}</div>
        <div class="teams">
          <div class="team"><div class="flag">${getFlag(m.home)}</div><div class="name">${m.home}</div>${m.result_home!=null?`<div class="score">${m.result_home}</div>`:''}</div>
          <div class="vs">${m.result_home!=null?'终场':'VS'}</div>
          <div class="team"><div class="flag">${getFlag(m.away)}</div><div class="name">${m.away}</div>${m.result_home!=null?`<div class="score">${m.result_away}</div>`:''}</div>
        </div>
        ${pred?`<div style="font-size:12px;color:var(--text-muted);text-align:center">我的预言：${m.home} ${pred.home}:${pred.away} ${m.away}</div>`:''}
        ${statusHtml}
      </div>`;
    });
  }
  
  if (!openM.length && !closedM.length) {
    html += `<div class="empty-state"><div class="icon">🔮</div><div class="title">暂无可预言比赛</div><div class="desc">等待管理员添加</div></div>`;
  } else if (!openM.length && closedM.length) {
    // All current round done, but no next round open yet
    html += `<div class="card" style="text-align:center;margin-top:12px;padding:16px">
      <div style="font-size:24px;margin-bottom:8px">⏳</div>
      <div style="font-size:14px;font-weight:600">本轮预言已结束</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px">下一轮比赛开放后将自动刷新</div>
    </div>`;
  }
  
  el.innerHTML = html;
}

  let html = `<div class="stage-tabs">`;
  html += `<div class="stage-tab active" data-stage="total" onclick="switchStage(this)">🔥 总榜</div>`;

async function switchStage(tabEl) {
  document.querySelectorAll('.stage-tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');
  renderRankings(tabEl.dataset.stage);
}

async function renderRankings(stage) {
  const container = document.getElementById('lb-content');
  if (!container) return;
  container.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
  
  let rankings;
  try { rankings = await api('/api/leaderboard?stage=' + stage); } catch(e) { rankings = []; }
  
  if (!rankings.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🏆</div><div class="title">暂无排行数据</div><div class="desc">有人预言且比赛出结果后自动生成</div></div>`;
    return;
  }
  
  let html = `<div class="card" style="padding:0 16px">`;
  rankings.forEach((r, i) => {
    const rc = i < 3 ? `r${i+1}` : '';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
    html += `<div class="leaderboard-item">
      <div class="rank ${rc}">${medal||(i+1)}</div>
      <div class="lb-info"><div class="lb-name">${r.name}</div><div class="lb-stats">猜中${r.correct}场 / 预言${r.predCount}场</div></div>
      <div class="lb-points">${r.points}<span> 分</span></div>
    </div>`;
  });
  html += `</div>`;
  
  const sn = stage === 'total' ? '总榜' : STAGES.find(s=>s.id===stage)?.name||'';
  html += `<div class="card" style="margin-top:12px;text-align:center">
    <div style="font-size:13px;color:var(--text-muted)">🏅 ${sn}奖励</div>
    <div style="margin-top:8px;font-size:14px">🥇 第1名 · 俱乐部定制奖品<br>🥈 第2名 · 足球周边<br>🥉 第3名 · 纪念品</div>
  </div>`;
  
  container.innerHTML = html;
}

// ========== ACTIONS ==========
async function submitAllPredictions() {
  if (!currentUser) { showUserModal(); return; }
  const now = new Date();
  const allOpenM = matchesCache.filter(m => {
    if (m.result_home != null) return false;
    if (m.home === 'TBD' || m.home.startsWith('1') || m.home.startsWith('2') || m.home.startsWith('3')) return false;
    const mt = new Date(m.match_date);
    const dl = new Date(mt.getTime() - 30*60000);
    return now < dl;
  });
  
  // Determine current round (same logic as renderPredict)
  if (allOpenM.length === 0) { showToast('⚠️ 当前没有可预言的比赛'); return; }
  allOpenM.sort((a, b) => a.match_date.localeCompare(b.match_date));
  const currentRoundStage = allOpenM[0].stage;
  const openM = allOpenM.filter(m => m.stage === currentRoundStage);
  
  let successCount = 0, failCount = 0, skipCount = 0;
  for (const m of openM) {
    const hEl = document.getElementById(`pred_${m.id}_h`);
    const aEl = document.getElementById(`pred_${m.id}_a`);
    if (!hEl || !aEl) continue;
    const h = parseInt(hEl.value);
    const a = parseInt(aEl.value);
    if (isNaN(h) || isNaN(a) || h < 0 || a < 0) { skipCount++; continue; }
    try {
      await api('/api/predict', { method: 'POST', body: JSON.stringify({ matchId: m.id, predHome: h, predAway: a }) });
      successCount++;
    } catch(e) { failCount++; }
  }
  
  if (successCount > 0) {
    showToast(`✅ ${getStageFullName(currentRoundStage)}已提交 ${successCount} 场预言！${skipCount > 0 ? `（${skipCount}场未填写）` : ''}`);
  } else if (skipCount > 0) {
    showToast(`⚠️ 请至少填写1场比赛的比分`);
  } else {
    showToast(`❌ 提交失败`);
  }
  
  await loadPredictions();
  renderView('predict');
}

async function addMatch() {
  const home = document.getElementById('add_home').value.trim();
  const away = document.getElementById('add_away').value.trim();
  const venue = document.getElementById('add_venue').value.trim();
  const dateVal = document.getElementById('add_date').value;
  const stage = document.getElementById('add_stage').value;
  const groupName = document.getElementById('add_group').value.trim().toUpperCase();
  if (!home || !away || !dateVal) { showToast('请填写完整信息！'); return; }
  try {
    await api('/api/admin/match', { method: 'POST', body: JSON.stringify({ stage, groupName, home, away, matchDate: dateVal, venue }) });
    showToast('✅ 比赛已添加！');
    await loadMatches();
    renderView('admin');
    renderView('predict');
  } catch(e) { showToast('❌ ' + e.message); }
}

async function saveResult(matchId) {
  const h = parseInt(document.getElementById(`res_${matchId}_h`).value);
  const a = parseInt(document.getElementById(`res_${matchId}_a`).value);
  if (isNaN(h) || isNaN(a) || h < 0 || a < 0) { showToast('请输入有效比分！'); return; }
  try {
    await api('/api/admin/result', { method: 'POST', body: JSON.stringify({ matchId, resultHome: h, resultAway: a }) });
    showToast('✅ 赛果已录入！积分已更新');
    await loadMatches();
    await loadPredictions();
    renderAll();
  } catch(e) { showToast('❌ ' + e.message); }
}

async function deleteMatch(matchId) {
  if (!confirm('确定删除这场比赛？')) return;
  try {
    await api('/api/admin/match/' + matchId, { method: 'DELETE' });
    showToast('已删除');
    await loadMatches();
    renderView('admin');
    renderView('predict');
  } catch(e) { showToast('❌ ' + e.message); }
}

async function resetSchedule() {
  if (!confirm('重置所有比赛为完整世界杯赛程？（已有预言会保留）')) return;
  try {
    const data = await api('/api/admin/reset-schedule', { method: 'POST' });
    showToast(`✅ 已重置 ${data.count} 场比赛！`);
    await loadMatches();
    renderAll();
  } catch(e) { showToast('❌ ' + e.message); }
}

// ========== POINTS ==========
function calcPoints(pred, result) {
  if (!pred || !result) return 0;
  const ph = pred.home, pa = pred.away, rh = result.home, ra = result.away;
  let pts = 0;
  const po = ph > pa ? 'W' : ph < pa ? 'L' : 'D';
  const ro = rh > ra ? 'W' : rh < ra ? 'L' : 'D';
  if (po === ro) pts += 1;
  if ((ph+pa<=2?1:0) === (rh+ra<=2?1:0) && po === ro) pts += 2;
  if (ph === rh && pa === ra) pts += 5;
  return pts;
}

function getBreakdown(pred, result) {
  if (!pred || !result) return [];
  const ph = pred.home, pa = pred.away, rh = result.home, ra = result.away;
  const bd = [];
  const po = ph > pa ? 'W' : ph < pa ? 'L' : 'D';
  const ro = rh > ra ? 'W' : rh < ra ? 'L' : 'D';
  if (po === ro) bd.push({type:'bronze',label:'胜负正确',pts:1});
  if ((ph+pa<=2?1:0) === (rh+ra<=2?1:0) && po === ro) bd.push({type:'gold',label:'区间正确',pts:2});
  if (ph === rh && pa === ra) bd.push({type:'crown',label:'比分命中',pts:5});
  return bd;
}

// ========== HELPERS ==========
function fmtDate(d) {
  const dt = new Date(d);
  return `${dt.getMonth()+1}月${dt.getDate()}日 ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ========== INIT ==========
(async function() {
  await checkAuth();
  updateUserUI();
  if (!currentUser) {
    setTimeout(() => showUserModal(), 500);
  }
  await renderAll();
})();
